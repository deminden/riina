[package]
name = "riina-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The generated library has no unit tests. Its visual integration test
# renders the same public components the application consumes.
test = false

[lints]
workspace = true

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
i-slint-renderer-software = "=1.19.1"
riina-test-support = { path = "../test-support" }
