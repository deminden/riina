[package]
name = "riina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
default-run = "riina"

[lints]
workspace = true

[dependencies]
slint.workspace = true
glow.workspace = true
serde_json.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
battery = "=0.7.8"
fontdb = "=0.24.0"
ttf-parser = "=0.25.1"
icu_experimental = "=0.6.0"
icu_locale = "=2.3.1"
sys-locale = "=0.3.2"
dirs = "=7.0.0"
rfd = "=0.17.2"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
riina-core = { path = "../core" }
riina-mpv = { path = "../mpv" }
zip.workspace = true
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

[build-dependencies]
slint-build.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSObjCRuntime", "NSLocale"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }
