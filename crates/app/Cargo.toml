[package]
name = "riina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
default-run = "riina"

[lib]
name = "riina_app"

[lints]
workspace = true

[dependencies]
slint.workspace = true
glow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "=1.0.28"
unicode-segmentation = "=1.13.3"
sha2 = "=0.11.2"
md-5 = "=0.11.0"
url.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
battery = "=0.7.8"
fontdb = "=0.24.0"
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
icu_casemap = "=2.4.0"
icu_decimal = { version = "=2.4.0", features = ["alloc", "ryu"] }
icu_experimental = "=0.7.0"
icu_locale = "=2.4.0"
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = "=2.4.0"
sys-locale = "=0.3.2"
dirs = "=7.0.0"
rfd = "=0.18.0"
trash = "=5.4.0"
lofty = "=0.25.5"
arboard = { version = "=3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
riina-core = { path = "../core" }
riina-mpv = { path = "../mpv" }
riina-ui = { path = "../ui" }
zip.workspace = true
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
encoding_rs = "=0.8.44"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
socket2 = "=0.6.5"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "=1.29.3", features = ["v4"] }
quick-xml = "=0.42.0"
plist = { version = "=1.10.5", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
roxmltree = "=0.21.2"
base64 = "=0.23.1"
keyring = "=4.2.0"
tempfile = "=3.27.0"

[build-dependencies]
winresource = "=0.1.34"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(not(target_os = "macos"))'.dependencies]
icu_datetime = "=2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "=5.4.3"
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes"] }
windows-core = "=0.62.2"
muda = { version = "=0.22.0", default-features = false }
wry.workspace = true
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Composition events use the same pinned runtime as the Slint Winit backend.
i-slint-core = { version = "=1.19.1", default-features = false }
libloading.workspace = true
zbus = "=6.5.0"
gtk = "=0.19.0"
webkit2gtk = { version = "=3.0.0", features = ["v2_38"] }
wry = { workspace = true, features = ["os-webview", "x11"] }
percent-encoding = "=2.3.2"
wayland-client = { version = "=0.31.15", features = ["system", "dlopen"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wl-clipboard-rs = "=0.9.5"
x11rb = { version = "=0.14.0", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSDictionary", "NSData", "NSDate", "NSDateFormatter", "NSError", "NSFileManager", "NSFormatter", "NSObject", "NSString", "NSURL", "NSUserDefaults", "NSValue", "NSGeometry", "NSObjCRuntime", "NSLocale", "NSProcessInfo", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSApplication", "NSResponder", "NSAccessibility", "NSFont", "NSFontDescriptor", "NSImage", "NSImageRep", "NSEvent", "NSHapticFeedback", "NSMenu", "NSView", "NSWindow", "NSPanel", "NSControl", "NSColor", "NSColorPanel", "NSScreen", "NSColorSpace", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDocumentController", "NSOpenPanel", "NSSavePanel", "NSTouch", "NSTouchBar", "NSTouchBarItem", "NSSliderTouchBarItem", "NSCustomTouchBarItem", "NSButton", "NSSlider", "NSSliderCell", "NSCell", "NSActionCell", "NSTextField", "NSGraphics", "NSGraphicsContext", "NSBezierPath", "NSUserInterfaceLayout", "block2", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGColorSpace", "CGDataProvider", "CGGeometry", "CGImage"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFData", "CFDictionary", "CFNumber", "CFString", "CFStringEncodingExt", "CFURL", "std"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "objc2-core-graphics"] }
objc2-quick-look-thumbnailing = { version = "=0.3.2", default-features = false, features = ["std", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation", "block2", "objc2-app-kit", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-av-kit = { version = "=0.3.2", default-features = false, features = ["AVPictureInPictureController", "AVPictureInPictureController_AVSampleBufferDisplayLayerSupport", "objc2-av-foundation", "objc2-core-media", "block2"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVQueuedSampleBufferRendering", "AVSampleBufferDisplayLayer", "AVSampleBufferVideoRenderer", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "block2"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "CMSync", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn", "objc2-io-surface", "objc2-open-gl"] }
objc2-open-gl = { version = "=0.3.2", default-features = false, features = ["CGLCurrent", "CGLTypes", "IOSurface", "objc2-io-surface"] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["IOSurfaceRef", "objc2", "objc2-core-foundation"] }
block2 = "=0.6.2"
objc2-media-player = { version = "=0.3.2", default-features = false, features = ["std", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "MPRemoteControlTypes", "block2", "objc2-app-kit", "objc2-core-foundation"] }
wry.workspace = true
percent-encoding = "=2.3.2"

[dev-dependencies]
riina-test-support = { path = "../test-support" }
i-slint-backend-testing = "=1.19.1"
riina-mpv = { path = "../mpv", features = ["test-support"] }
