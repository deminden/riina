[package]
name = "riina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
default-run = "riina"

[lints]
workspace = true

[dependencies]
slint.workspace = true
glow.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "=1.13.3"
sha2 = "=0.10.9"
md-5 = "=0.11.0"
url.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
battery = "=0.7.8"
fontdb = "=0.24.0"
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
icu_experimental = "=0.6.0"
icu_decimal = { version = "=2.3.0", features = ["alloc", "ryu"] }
icu_locale = "=2.3.1"
sys-locale = "=0.3.2"
dirs = "=7.0.0"
rfd = "=0.17.2"
trash = "=5.2.9"
lofty = "=0.25.4"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
riina-core = { path = "../core" }
riina-mpv = { path = "../mpv" }
zip.workspace = true
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
encoding_rs = "=0.8.42"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
quick-xml = "=0.41.0"
roxmltree = "=0.20.0"
base64 = "=0.23.1"
keyring = "=4.2.0"

[build-dependencies]
slint-build.workspace = true
winresource = "=0.1.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_UI_Accessibility"] }
muda = { version = "=0.19.3", default-features = false }
wry.workspace = true
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"
gtk = "=0.18.2"
wry = { workspace = true, features = ["os-webview", "x11"] }
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSData", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL", "NSUserDefaults", "NSValue", "NSGeometry", "NSObjCRuntime", "NSLocale", "NSProcessInfo", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSApplication", "NSResponder", "NSAccessibility", "NSFont", "NSImage", "NSEvent", "NSMenu", "NSView", "NSWindow", "NSPanel", "NSControl", "NSColor", "NSColorPanel", "NSScreen", "NSColorSpace", "NSPasteboard", "NSPasteboardItem", "NSDocumentController", "block2", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGColorSpace", "CGDataProvider", "CGGeometry", "CGImage"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL", "std"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "objc2-core-graphics"] }
objc2-quick-look-thumbnailing = { version = "=0.3.2", default-features = false, features = ["std", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation", "block2", "objc2-app-kit", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-av-kit = { version = "=0.3.2", default-features = false, features = ["AVPictureInPictureController", "AVPictureInPictureController_AVSampleBufferDisplayLayerSupport", "objc2-av-foundation", "objc2-core-media", "block2"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVQueuedSampleBufferRendering", "AVSampleBufferDisplayLayer", "AVSampleBufferVideoRenderer", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "block2"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "CMSync", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn", "objc2-io-surface", "objc2-open-gl"] }
objc2-open-gl = { version = "=0.3.2", default-features = false, features = ["CGLCurrent", "CGLTypes", "IOSurface", "objc2-io-surface"] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["IOSurfaceRef", "objc2", "objc2-core-foundation"] }
block2 = "=0.6.2"
objc2-media-player = { version = "=0.3.2", default-features = false, features = ["std", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "MPRemoteControlTypes", "block2", "objc2-app-kit", "objc2-core-foundation"] }
wry.workspace = true
percent-encoding = "=2.3.2"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
