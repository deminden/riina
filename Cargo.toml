[workspace]
members = ["crates/core", "crates/mpv", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "accessibility", "unstable-winit-030", "raw-window-handle-06"] }
slint-build = "=1.13.1"
libloading = "=0.8.9"
glow = "=0.16.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[workspace.lints.rust]
# Every FFI operation needs its own reviewed unsafe boundary, even inside unsafe fn.
unsafe_op_in_unsafe_fn = "deny"
