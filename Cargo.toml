[workspace]
members = ["crates/core", "crates/mpv", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
version = "4.2.0"

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "accessibility", "unstable-winit-030", "raw-window-handle-06"] }
slint-build = "=1.18.1"
libloading = "=0.9.0"
glow = "=0.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Power", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "UI_ViewManagement", "Globalization", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
wry = { version = "=0.57.0", default-features = false }

[workspace.lints.rust]
# Every FFI operation needs its own reviewed unsafe boundary, even inside unsafe fn.
unsafe_op_in_unsafe_fn = "deny"
