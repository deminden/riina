name: Windows compilation and domain checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
        with:
          fetch-depth: 0
      - name: Pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependency and compiler outputs
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'clippy.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'clippy.toml', '.cargo/config.toml') }}-
      - name: Reference integrity and traceability
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/fetch-reference.ps1
          python scripts/check-parity.py
          python scripts/check-settings-navigation.py
          python scripts/check-fixtures.py
          python scripts/check-assets.py
          python scripts/check-assets.py --staged
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust source line lengths
        shell: pwsh
        env:
          RIINA_LINE_LENGTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:RIINA_LINE_LENGTH_BASE -and $env:RIINA_LINE_LENGTH_BASE -notmatch '^0+$') {
            python scripts/check-line-length.py --baseline $env:RIINA_LINE_LENGTH_BASE
          } else {
            python scripts/check-line-length.py
          }
          exit $LASTEXITCODE
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Domain tests
        run: cargo test --workspace --locked
      - name: Actual Windows application compilation
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Preserve compiler outputs
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  native:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore the pinned development runtime archive
        id: mpv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: tools/mpv-dev.7z
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/fetch-mpv.ps1') }}
      - name: Verify and unpack the pinned development DLL
        shell: pwsh
        run: ./scripts/fetch-mpv.ps1
      - name: Preserve the verified runtime archive
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: tools/mpv-dev.7z
          key: ${{ steps.mpv-cache.outputs.cache-primary-key }}
      - name: Native engine tests with null output
        run: cargo xtask native
      - name: Verification scope
        shell: pwsh
        run: Write-Output 'This job verifies the engine on the pinned DLL with null output. GUI, HDR, hardware decoding and audible output require separate evidence.'

  advisories:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
      - name: Audit the locked Rust dependencies
        run: |
          archive=cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          audit_dir="$(mktemp -d)"
          cd "$audit_dir"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.23.0/$archive"
          printf '%s  %s\n' 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59' "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive"
          "./${archive%.tgz}/cargo-audit" audit --file "$GITHUB_WORKSPACE/Cargo.lock"
