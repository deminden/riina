name: Portable playback core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified v4.2.2
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      # Selecting the core keeps HWNDs, COM, GUI and native codecs out of these checks.
      # This proves shared behavior portability, not application playback support.
      - name: Portable state and engine interface tests
        run: cargo test -p riina-core -p riina-mpv --lib --locked
      - name: Portable core lint
        run: cargo clippy -p riina-core -p riina-mpv --all-targets --locked -- -D warnings
