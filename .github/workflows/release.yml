name: Windows release
on:
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: Build and test a private Windows package candidate without publishing a release
        type: boolean
        required: true
        default: false
      native_artifact_run_id:
        description: Reuse a successful native engine and source build from this workflow run
        type: string
        required: false
        default: ''
      native_release_tag:
        description: Reuse the matching engine from an existing published Windows release, for example v0.3.8
        type: string
        required: false
        default: ''
      publish_release:
        description: Publish this version after package, playback and corresponding-source verification pass
        type: boolean
        required: true
        default: false
      release_source_tag:
        description: Existing immutable source tag to package and publish, for example v0.3.3
        type: string
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    outputs:
      release_ready: ${{ steps.readiness.outputs.release_ready }}
      native_run_id: ${{ steps.readiness.outputs.native_run_id }}
      native_release_tag: ${{ steps.readiness.outputs.native_release_tag }}
      source_ref: ${{ steps.readiness.outputs.source_ref }}
      source_sha: ${{ steps.readiness.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
      - name: Check exact candidate verification status
        id: readiness
        shell: bash
        env:
          NATIVE_ARTIFACT_RUN_ID: ${{ inputs.native_artifact_run_id }}
          NATIVE_RELEASE_TAG: ${{ inputs.native_release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          BUILD_CANDIDATE: ${{ inputs.build_release_candidate }}
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
        run: |
          if [[ "$PUBLISH_RELEASE" == true && "$BUILD_CANDIDATE" != true ]]; then
            echo 'Publishing requires a complete package candidate in this run' >&2
            exit 1
          fi
          source_ref="$GITHUB_SHA"
          source_sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$RELEASE_SOURCE_TAG" ]]; then
            [[ "$RELEASE_SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo 'release_source_tag must be an immutable semantic-version tag' >&2
              exit 1
            }
            git fetch --depth=1 origin "refs/tags/$RELEASE_SOURCE_TAG:refs/tags/$RELEASE_SOURCE_TAG"
            source_ref="$RELEASE_SOURCE_TAG"
            source_sha="$(git rev-list -n1 "$source_ref")"
            source_version="$(git show "$source_sha:Cargo.toml" | sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' | head -n1)"
            [[ "$RELEASE_SOURCE_TAG" == "v$source_version" ]] || {
              echo 'release_source_tag does not match the version in its source' >&2
              exit 1
            }
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$NATIVE_RELEASE_TAG" ]]; then
            [[ "$NATIVE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && -z "$NATIVE_ARTIFACT_RUN_ID" ]] || {
              echo 'Select one native reuse source; native_release_tag must be a semantic-version tag' >&2
              exit 1
            }
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            echo 'native_run_id=' >> "$GITHUB_OUTPUT"
            echo "native_release_tag=$NATIVE_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$NATIVE_ARTIFACT_RUN_ID" ]]; then
            [[ "$NATIVE_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo 'native_artifact_run_id must be a positive numeric workflow run ID' >&2
              exit 1
            }
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            echo "native_run_id=$NATIVE_ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            python scripts/check-release-artifacts.py readiness >> "$GITHUB_OUTPUT"
          fi

  native-engine:
    if: inputs.build_release_candidate && inputs.native_artifact_run_id == '' && inputs.native_release_tag == ''
    runs-on: ubuntu-24.04
    needs: release-readiness
    container:
      image: ghcr.io/shinchiro/archlinux@sha256:c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
    timeout-minutes: 360
    env:
      CCACHE_DIR: /__w/_temp/riina-ccache
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
      - name: Verify portable runtime checks before compiling native dependencies
        run: |
          bash -n tools/mpv/build-windows.sh
      - name: Restore native compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-clang-x64-b2856ee-${{ hashFiles('tools/mpv/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-clang-x64-b2856ee-
      - name: Build pinned native engine and source index
        shell: bash
        env:
          RIINA_BUILD_IMAGE: ghcr.io/shinchiro/archlinux@sha256:c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
        run: |
          set -o pipefail
          mkdir -p "$CCACHE_DIR"
          bash tools/mpv/build-windows.sh 2>&1 | tee native-build.log
      - name: Upload native build diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        with:
          name: native-engine-failure-logs
          path: |
            native-build.log
            native-build-failure.log
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve compiler cache even after a dependency failure
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-clang-x64-b2856ee-${{ hashFiles('tools/mpv/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        with:
          name: windows-native-engine
          path: native-runtime/
          if-no-files-found: error
          retention-days: 7
  windows-package:
    if: always() && needs.release-readiness.result == 'success' && inputs.build_release_candidate && (needs.native-engine.result == 'success' || (needs.native-engine.result == 'skipped' && (needs.release-readiness.outputs.native_run_id != '' || needs.release-readiness.outputs.native_release_tag != '')))
    runs-on: windows-latest
    needs: [release-readiness, native-engine]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      RIINA_BUILD_NUMBER: ${{ github.run_number }}
      RIINA_SOURCE_SHA: ${{ needs.release-readiness.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
        with:
          ref: ${{ needs.release-readiness.outputs.source_ref }}
      - name: Packaging regressions for the exact selected source
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # verified v8.0.1
        if: needs.native-engine.result == 'success'
        with:
          name: windows-native-engine
          path: native-runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # verified v8.0.1
        if: needs.native-engine.result == 'skipped' && needs.release-readiness.outputs.native_run_id != ''
        with:
          name: windows-native-engine
          path: native-runtime
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-readiness.outputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Restore matching engine from a published package
        if: needs.release-readiness.outputs.native_release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RELEASE_TAG: ${{ needs.release-readiness.outputs.native_release_tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --depth=1 origin "refs/tags/${env:NATIVE_RELEASE_TAG}:refs/tags/${env:NATIVE_RELEASE_TAG}"
          $archive = "riina-$($env:NATIVE_RELEASE_TAG.Substring(1))-windows-x86_64.zip"
          gh release download $env:NATIVE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern $archive --pattern SHA256SUMS.txt --pattern RELEASE-VERIFICATION.json --dir native-release-input
          python scripts/check-release-artifacts.py restore-runtime `
            --archive "native-release-input/$archive" --checksums native-release-input/SHA256SUMS.txt `
            --verification native-release-input/RELEASE-VERIFICATION.json --tag $env:NATIVE_RELEASE_TAG `
            --destination native-runtime
      - name: Verify downloaded native runtime hashes
        run: python scripts/check-release-artifacts.py runtime --directory native-runtime
      - name: Pinned Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain 1.99.0
      - name: Restore Rust dependency and compiler outputs
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # verified v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-rust-1.99.0-static-crt-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-release-rust-1.99.0-static-crt-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            windows-release-rust-1.99.0-static-crt-
      - name: Verify source and test fixtures
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/fetch-reference.ps1
          python scripts/check-parity.py
          python scripts/check-settings-navigation.py
          python scripts/check-fixtures.py
          python scripts/check-assets.py
          cargo fmt --all -- --check
      - name: Native playback and lifecycle tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Content -Path native-playback-tests.log -Value '' -Encoding utf8
          $env:RIINA_TEST_MPV_LIBRARY = (Resolve-Path native-runtime/libmpv-2.dll).Path
          # These runners have no speakers. mpv's clocked null AO still decodes
          # selected audio and exercises transport/lifecycle without introducing
          # an unrelated OpenAL device into the Windows WASAPI application path.
          $env:RIINA_TEST_MPV_AUDIO_OUTPUT = 'null'
          $env:RIINA_TEST_TRACE_SHUTDOWN = '1'
          $runtimePath = (Resolve-Path native-runtime).Path
          $env:PATH = "$runtimePath;$env:PATH"
          cargo test -p riina-mpv --test native --locked -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath native-playback-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Native playback and lifecycle tests failed with exit code $LASTEXITCODE." }
      - name: Capture the hosted native shutdown fault
        if: failure()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'Procdump.zip'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          $tools = Join-Path $env:RUNNER_TEMP 'riina-crash-tools'
          Expand-Archive $archive $tools
          $procdump = Join-Path $tools 'procdump64.exe'
          $signature = Get-AuthenticodeSignature $procdump
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Native diagnostic utility is not a verified Microsoft executable.'
          }
          $env:RIINA_TEST_MPV_LIBRARY = (Resolve-Path native-runtime/libmpv-2.dll).Path
          $env:RIINA_TEST_MPV_AUDIO_OUTPUT = 'null'
          $env:RIINA_TEST_TRACE_SHUTDOWN = '1'
          $runtimePath = (Resolve-Path native-runtime).Path
          $env:PATH = "$runtimePath;$env:PATH"
          $test = Get-ChildItem target/debug/deps/native-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$test) { throw 'No compiled native test executable is available.' }
          New-Item -ItemType Directory native-fault -Force | Out-Null
          # A failed runner gets one instrumented reproduction with a mini dump; its
          # stack and module addresses distinguish engine faults from FFI misuse.
          # Diagnostic artifacts are never copied into public release assets.
          $started = Get-Date
          $diagnostic = Start-Process -FilePath $procdump -WindowStyle Hidden -PassThru `
            -ArgumentList @('-accepteula', '-mm', '-e', '-x', 'native-fault', $test.FullName, '--ignored', '--nocapture', '--test-threads=1') `
            -RedirectStandardOutput native-fault/procdump.log -RedirectStandardError native-fault/procdump-error.log
          if (!$diagnostic.WaitForExit(90000)) {
            # Capture the process launched by this diagnostic, not another test or
            # player. A blocked Drop must fail verification, never turn into a pass.
            $children = Get-CimInstance Win32_Process | Where-Object {
              $_.ParentProcessId -eq $diagnostic.Id -and $_.ExecutablePath -eq $test.FullName -and $_.CreationDate -ge $started
            }
            foreach ($child in $children) {
              & $procdump -accepteula -mm $child.ProcessId "native-fault/hang-$($child.ProcessId).dmp"
              Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $diagnostic.Id -Force -ErrorAction SilentlyContinue
          }
          $debugger = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($debugger) {
            Get-ChildItem native-fault/*.dmp | ForEach-Object {
              & $debugger.FullName -z $_.FullName -c '.symfix;.reload;.ecxr;k;~*k;!analyze -v;q' 2>&1 | Tee-Object -Append native-fault/stack.log
            }
          }
      - name: Preserve native test output after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        with:
          name: native-playback-failure-logs
          path: |
            native-playback-tests.log
            native-fault/
          if-no-files-found: warn
          retention-days: 7
      - name: Lint and unit tests
        shell: pwsh
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($env:RELEASE_SOURCE_TAG -eq 'v0.3.6') {
            Write-Host 'The v0.3.6 plugin sidebar test creates a renderer-backed window; exclude this headless-only test for this historical source tag.'
            cargo test --workspace --locked -- --skip plugin_panel_opens_on_the_saved_side
          } else {
            cargo test --workspace --locked
          }
      - name: Build and assemble portable package
        id: package-build
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p riina --release --locked --target x86_64-pc-windows-msvc
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dist = Join-Path $PWD "dist/riina-$version-windows-x86_64"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/riina.exe $dist
          Copy-Item native-runtime/* $dist -Recurse -Force
          Copy-Item LICENSE, LICENSE-GPL-3.0.txt, THIRD_PARTY_NOTICES.md, README.md $dist
          Copy-Item docs/licensing.md $dist/LICENSING.md
          Copy-Item docs/SOURCE-ACCESS.md $dist/SOURCE-ACCESS.md
          $env:RIINA_SOURCE_SHA | Set-Content -NoNewline (Join-Path $dist 'SOURCE-COMMIT.txt')
          python scripts/check-windows-runtime.py --package "$dist"
          if ($LASTEXITCODE -ne 0) { throw 'Portable package has unresolved Windows imports.' }
          python scripts/package-rust-licenses.py --output "$dist/THIRD_PARTY_LICENSES/RUST"
          $slintLicense = Join-Path $env:RUNNER_TEMP 'SLINT-ROYALTY-FREE-2.0.pdf'
          Invoke-WebRequest -Uri 'https://slint.dev/agreements/slint-royalty-free-license.pdf' -OutFile $slintLicense
          if ((Get-FileHash $slintLicense -Algorithm SHA256).Hash.ToLower() -ne '934fbcbccbda12c24ae04869128dd6cb89fdca45b93e437176ab667da437b60d') { throw 'Pinned Slint license agreement hash changed.' }
          Copy-Item $slintLicense "$dist/THIRD_PARTY_LICENSES/SLINT-ROYALTY-FREE-2.0.pdf"
          @"
          Riina $version for Windows x86_64

          This portable package contains the Windows application and its complete
          mpv runtime. The corresponding application source is linked from the
          release's exact source tag. Native source repositories and revisions are
          listed in SOURCE-MANIFEST.tsv; rebuild instructions are in SOURCE-ACCESS.md.

          Extract this folder and run riina.exe. No installer is required.
          "@ | Set-Content -Encoding utf8 (Join-Path $dist 'README.txt')
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/riina-$version-windows-x86_64.zip" -CompressionLevel Optimal
          Get-FileHash "dist/riina-$version-windows-x86_64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  riina-$version-windows-x86_64.zip" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Expand-Archive "dist/riina-$version-windows-x86_64.zip" -DestinationPath package-smoke
          python scripts/check-windows-runtime.py --package package-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted package has unresolved Windows imports.' }
          $env:RIINA_TEST_MPV_LIBRARY = (Resolve-Path package-smoke/libmpv-2.dll).Path
          $env:RIINA_TEST_MPV_AUDIO_OUTPUT = 'null'
          $env:RIINA_TEST_TRACE_SHUTDOWN = '1'
          $packagePath = (Resolve-Path package-smoke).Path
          $env:PATH = "$packagePath;$env:PATH"
          cargo test -p riina-mpv --test native --locked --target x86_64-pc-windows-msvc playback_pause_seek_stop_failure_and_shutdown -- --ignored --exact --nocapture
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.release_source_tag != ''
        with:
          ref: ${{ github.sha }}
          path: release-gui-tools
      - name: Supply software OpenGL for the hosted test only
        shell: pwsh
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
        run: |
          $tool = 'scripts/prepare-windows-ci-graphics.py'
          if ($env:RELEASE_SOURCE_TAG) { $tool = "release-gui-tools/$tool" }
          python $tool --application package-smoke --archive "${{ runner.temp }}/mesa-ci.7z"
      - name: Exercise the extracted application and native controls
        timeout-minutes: 3
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ./scripts/smoke-windows-package.ps1 -Executable (Resolve-Path package-smoke/riina.exe).Path -Fixture (Resolve-Path tests/fixtures/moving-square.avi).Path -ReportPath (Join-Path $env:RUNNER_TEMP 'riina-gui-smoke.json')
      - name: Preserve application smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-application-smoke
          path: |
            ${{ runner.temp }}/riina-gui-smoke.json
            ${{ runner.temp }}/riina-gui-smoke.json.stderr.log
            ${{ runner.temp }}/riina-gui-smoke.json.stdout.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        if: always() && steps.package-build.outcome == 'success'
        with:
          name: windows-package
          path: |
            dist/riina-*-windows-x86_64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve successful compiler outputs even after a GUI failure
        if: always() && steps.package-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  package-verification:
    if: always() && needs.windows-package.result == 'success'
    runs-on: ubuntu-24.04
    needs: [release-readiness, windows-package]
    outputs:
      version: ${{ steps.package.outputs.version }}
      source_sha: ${{ steps.package.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
        with:
          ref: ${{ needs.release-readiness.outputs.source_ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # verified v8.0.1
        with:
          name: windows-package
          path: release-assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_tag != '' }}
        with:
          ref: ${{ github.sha }}
          path: release-audit-tools
      - name: Audit exact extracted binary and corresponding source
        id: package
        env:
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          test -f "release-assets/riina-$version-windows-x86_64.zip"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          mkdir binary-source-check
          unzip -q "release-assets/riina-$version-windows-x86_64.zip" -d binary-source-check
          python scripts/check-windows-runtime.py --package binary-source-check
          audit_tool=scripts/check-release-artifacts.py
          if [[ -n "$RELEASE_SOURCE_TAG" ]]; then
            audit_tool=release-audit-tools/scripts/check-release-artifacts.py
          fi
          python "$audit_tool" package --binary binary-source-check \
            --source "$GITHUB_WORKSPACE" --version "$version" \
            > release-assets/RELEASE-VERIFICATION.json
          cat release-assets/RELEASE-VERIFICATION.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified v7.0.2
        with:
          name: verified-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.release-readiness.result == 'success' && needs.windows-package.result == 'success' && needs.package-verification.result == 'success' && inputs.build_release_candidate && inputs.publish_release
    runs-on: ubuntu-24.04
    needs: [release-readiness, windows-package, package-verification]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-readiness.outputs.source_ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # verified v8.0.1
        with:
          name: verified-release-assets
          path: release-assets
      - name: Publish release with binary and source access information
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package-verification.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.package-verification.outputs.source_sha }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          tag="v$version"
          # Never attach new assets to a tag pointing at different application
          # sources. A dispatch creates the version tag only after verification.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$tag")" = "$RELEASE_SOURCE_SHA"
          else
            git tag "$tag" "$RELEASE_SOURCE_SHA"
            git push origin "refs/tags/$tag"
          fi
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          **[Download Riina $version for Windows]($repo/releases/download/$tag/riina-$version-windows-x86_64.zip)**

          These are portable binaries for Windows 11 (64-bit). Everything needed
          to play video and audio is included, and no installation is required.

          1. Download the Windows ZIP above.
          2. Extract it to a folder of your choice.
          3. Open riina.exe and choose a video or audio file.
          EOF
          feature_notes="docs/release-notes/$version.md"
          if [[ -f "$feature_notes" ]]; then
            printf '\n' >> release-notes.md
            cat "$feature_notes" >> release-notes.md
          fi
          latest_tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          latest_flag=(--latest)
          if [[ -n "$latest_tag" && "$latest_tag" != "$tag" ]]; then
            latest_version="${latest_tag#v}"
            greatest_version="$(printf '%s\n%s\n' "$version" "$latest_version" | sort -V | tail -n1)"
            if [[ "$greatest_version" != "$version" ]]; then
              latest_flag=(--latest=false)
            fi
          fi
          gh release create "$tag" \
            "release-assets/riina-$version-windows-x86_64.zip" \
            "release-assets/SHA256SUMS.txt" \
            "release-assets/RELEASE-VERIFICATION.json" \
            --verify-tag --title "Riina $version" --notes-file release-notes.md "${latest_flag[@]}"
          release_url="$repo/releases/tag/$tag"
          {
            echo "## Riina $version release"
            echo "[Download Windows x64]($release_url)"
            echo ""
            echo "The release page is also surfaced in the repository's Releases panel."
          } >> "$GITHUB_STEP_SUMMARY"
